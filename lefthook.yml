pre-commit:
  commands:
    staged:
      # Формат + линт + типы только по изменённым файлам (конфиг в блоке `staged` vite.config.ts)
      run: bunx vp staged
    fsd:
      glob: 'src/**'
      run: bun run lint:fsd

commit-msg:
  commands:
    conventional-commits:
      run: bun scripts/check-commit-msg.ts {1}
