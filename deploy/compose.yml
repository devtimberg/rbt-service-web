# Деплой rbt74-service-web (docker compose, shell-раннер). test и prod живут на одном сервере:
# окружения различаются переменными из deploy/<окружение>.env (STACK_NAME, APP_HOST, API_INTERNAL_URL).
# Пайплайн кладёт этот файл и .env в /opt/rbt74/apps/$STACK_NAME.
# Вручную: cd /opt/rbt74/apps/<STACK_NAME> && docker compose up -d
name: ${STACK_NAME:?}

services:
  web:
    image: rbt74-service-web:${IMAGE_TAG:?}
    restart: unless-stopped
    env_file: .env
    mem_limit: 512m
    networks:
      - proxy
    healthcheck:
      # в alpine-образе есть node: проверяем, что SSR-сервер отвечает
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    labels:
      - traefik.enable=true
      # Сайт на корне основного домена окружения. /api забирает бэкенд: у его правила
      # PathPrefix длиннее, поэтому приоритет у Traefik выше
      - traefik.http.routers.${STACK_NAME}.rule=Host(`${APP_HOST:?}`)
      - traefik.http.routers.${STACK_NAME}.entrypoints=websecure
      # Белый список домена (middleware определён в stacks/traefik инфраструктуры)
      - traefik.http.routers.${STACK_NAME}.middlewares=${ACCESS_MIDDLEWARE:?}
      - traefik.http.services.${STACK_NAME}.loadbalancer.server.port=3000

networks:
  proxy:
    name: rbt74-proxy
    external: true
