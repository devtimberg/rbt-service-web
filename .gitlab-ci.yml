# Сборка и деплой rbt74-service-web shell-раннером прямо на сервере окружения.
# Node на сервере не нужен: зависимости и next build выполняются внутри Dockerfile (multi-stage).
#
#   ветки main и devops -> test (раннер с тегом rbt74-test, https://test.rbt74.ru/)
#
# Образ собирается локальным docker и в registry не пушится: деплой идёт на том же хосте.
# Все настройки окружения берутся из deploy/<окружение>.env.

variables:
  APP_NAME: rbt74-service-web
  DEPLOY_DIR: /opt/rbt74/apps/rbt74-service-web
  IMAGE_TAG: $CI_COMMIT_SHORT_SHA
  # Сколько последних образов сервиса хранить на сервере для отката
  KEEP_IMAGES: "3"

stages: [build, deploy]

workflow:
  rules:
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "devops"
      variables: { RUNNER_TAG: rbt74-test, DEPLOY_ENV_NAME: test }

default:
  tags: [$RUNNER_TAG]

build:
  stage: build
  script:
    - docker build --pull -t "$APP_NAME:$IMAGE_TAG" .

deploy:
  stage: deploy
  environment:
    name: $DEPLOY_ENV_NAME
    url: https://test.rbt74.ru/
  resource_group: $DEPLOY_ENV_NAME
  script:
    - mkdir -p "$DEPLOY_DIR"
    - cp deploy/compose.yml "$DEPLOY_DIR/compose.yml"
    - |
      {
        cat "deploy/$DEPLOY_ENV_NAME.env"
        echo "IMAGE_TAG=$IMAGE_TAG"
      } > "$DEPLOY_DIR/.env.new"
    - chmod 600 "$DEPLOY_DIR/.env.new" && mv "$DEPLOY_DIR/.env.new" "$DEPLOY_DIR/.env"
    - cd "$DEPLOY_DIR"
    - docker compose up -d --wait --wait-timeout 180 || { docker compose logs --tail=200; exit 1; }
    # Старые образы сервиса: оставляем KEEP_IMAGES последних, используемый docker удалить не даст
    - >-
      docker image ls "$APP_NAME" --format '{{.CreatedAt}}|{{.Repository}}:{{.Tag}}' | sort -r |
      tail -n +$((KEEP_IMAGES + 1)) | cut -d'|' -f2 | xargs -r docker rmi || true
